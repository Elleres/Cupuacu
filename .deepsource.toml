version = 1

# Padrões globais de arquivos para ignorar
# É importante ignorar ambientes virtuais e arquivos de cache
exclude_patterns = [
  "**/venv/**",
  "**/.venv/**",
  "**/env/**",
  "**/__pycache__/**",
  "**/migrations/**",  # Ignora migrações de banco de dados (comum em Django)
  "**/build/**",
  "**/dist/**",
  "**/*.egg-info/**"
]

# Padrões para identificar arquivos de teste
test_patterns = [
  "**/tests/**",
  "**/test_*.py",
  "**/*_test.py"
]

# Configuração do Analisador Python
[[analyzers]]
name = "python"
enabled = true

  # Configurações opcionais específicas do analisador
  [analyzers.meta]
  runtime_version = "3.10"  # Defina sua versão do Python aqui (ex: 3.8, 3.9, 3.11)

  # Opcional: Ignorar falta de documentação (docstrings) se preferir menos ruído
  # skip_doc_coverage = ["class", "magic_method"]

# Opcional: Transformers (Formatadores Automáticos)
# Descomente abaixo se você usa Black ou autopep8 para corrigir o código automaticamente
# [[transformers]]
# name = "black"
# enabled = true

# [[transformers]]
# name = "isort"
# enabled = true
